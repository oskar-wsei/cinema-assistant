[tox]
envlist = py312, ruff

[testenv]
deps = .[test]
setenv = PYTHONPATH = {toxinidir}
commands = pytest --cov api/ --cov-report term-missing --cov-report xml --junitxml={toxinidir}/test-reports/junit-{envname}.xml tests/

[testenv:reformat]
skip_install = true
deps = ruff
commands =
    ruff format
    ruff check --fix

[testenv:ruff]
skip_install = true
deps =
    ruff
commands =
    ruff check
    ruff format --check
