<a class="card" [routerLink]="['/movies', movie().id]">
  <div class="card__poster">
    <img
      [src]="movie().poster_url"
      [alt]="movie().title"
      width="220"
      height="330"
      loading="lazy"
      decoding="async"
    />
    @if (formats().length) {
      <ul class="badges card__formats" aria-label="Formaty">
        @for (format of formats(); track format) {
          <li class="badge">{{ format }}</li>
        }
      </ul>
    }
  </div>
  <h3 class="card__title">{{ movie().title }}</h3>
  @if (upcomingRelease(); as releaseDate) {
    <p class="card__meta">Premiera {{ releaseDate | date: 'd MMMM' }}</p>
  }
</a>
