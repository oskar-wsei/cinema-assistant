[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-assistant"
version = "1.0.0"
description = "AI Assistant for Cinema City"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "requests-cache>=1.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "ruff>=0.6",
    "types-requests",
    "tox",
]
test = [
    "pytest",
    "pytest-cov",
    "requests-mock",
]

[tool.setuptools]
py-modules = ["cinemacity"]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["api"]
branch = true

[tool.coverage.report]
exclude_also = ["assert_never\\("]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
